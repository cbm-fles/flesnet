# Fluent Bit on a node: sends the JSON log files of flesnet to OpenSearch
#
# Reads the files *.log in FLESNET_LOG_DIR and in its subdirectories (e.g.
# one per run). Settings come from the environment, see opensearch.env.

[SERVICE]
    flush                     1
    log_level                 info
    parsers_file              parsers-flesnet.conf
    # buffer chunks on disk, so that they survive a restart of Fluent Bit or
    # an unreachable OpenSearch
    storage.path              ${FLUENT_BIT_STATE_DIR}/storage
    storage.sync              normal
    storage.backlog.mem_limit 16M

[INPUT]
    Name                      tail
    Tag                       flesnet.oper
    Path                      ${FLESNET_LOG_DIR}/*.log,${FLESNET_LOG_DIR}/*/*.log
    Path_Key                  log_file
    Parser                    flesnet_json
    # the read position in each file
    DB                        ${FLUENT_BIT_STATE_DIR}/tail.db
    DB.locking                true
    # read files that exist at the start from their beginning; the read
    # positions above prevent that they are sent again after a restart
    Read_from_Head            true
    Refresh_Interval          5
    Rotate_Wait               30
    Buffer_Max_Size           1M
    Skip_Long_Lines           On
    storage.type              filesystem
    Mem_Buf_Limit             64M

# Debug and trace messages go to indices of their own, which are kept for a
# shorter time
[FILTER]
    Name                      rewrite_tag
    Match                     flesnet.oper
    Rule                      $severity_text ^(TRACE|DEBUG)$ flesnet.debug false
    Emitter_Name              flesnet_debug
    Emitter_Storage.type      filesystem
    Emitter_Mem_Buf_Limit     64M

[OUTPUT]
    Name                      opensearch
    Alias                     oper
    Match                     flesnet.oper
    Host                      ${OPENSEARCH_HOST}
    Port                      9200
    HTTP_User                 fluentbit
    HTTP_Passwd               ${OPENSEARCH_PASSWORD}
    # the demo certificate of the test setup, hence no verification
    tls                       On
    tls.verify                Off
    # index by the date of the message: logs-flesnet-oper-YYYY.MM
    Logstash_Format           On
    Logstash_Prefix           logs-flesnet-oper
    Logstash_DateFormat       %Y.%m
    Suppress_Type_Name        On
    # @timestamp from the parsed time, with its microseconds
    Time_Key                  @timestamp
    Time_Key_Nanos            On
    # retried requests do not create duplicates
    Generate_ID               On
    Buffer_Size               64M
    Trace_Error               On
    # gives up on a chunk after some hours (random backoff of up to 2000 s),
    # so that data OpenSearch rejects does not stay forever
    Retry_Limit               20
    storage.total_limit_size  2G

[OUTPUT]
    Name                      opensearch
    Alias                     debug
    Match                     flesnet.debug
    Host                      ${OPENSEARCH_HOST}
    Port                      9200
    HTTP_User                 fluentbit
    HTTP_Passwd               ${OPENSEARCH_PASSWORD}
    tls                       On
    tls.verify                Off
    # index by the date of the message: logs-flesnet-debug-YYYY.MM.DD
    Logstash_Format           On
    Logstash_Prefix           logs-flesnet-debug
    Logstash_DateFormat       %Y.%m.%d
    Suppress_Type_Name        On
    Time_Key                  @timestamp
    Time_Key_Nanos            On
    Generate_ID               On
    Buffer_Size               64M
    Trace_Error               On
    Retry_Limit               20
    storage.total_limit_size  2G
